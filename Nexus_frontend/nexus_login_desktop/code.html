<style>
        .input-glow:focus {
            outline: 2px solid theme('colors.primary');
            outline-offset: -1px;
            box-shadow: 0 0 0 4px rgba(78, 222, 163, 0.1);
        }
    </style>

<body class="bg-background text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary selection:text-on-primary">
<!-- Minimal Header -->
<header class="w-full flex items-center justify-between p-margin-mobile md:px-margin-desktop md:py-6 border-b border-border bg-background z-10 sticky top-0">
<a class="flex items-center gap-2 text-text-secondary hover:text-text-primary transition-colors group" href="#">
<span class="material-symbols-outlined text-xl group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
<span class="font-label-md text-label-md uppercase tracking-widest hidden sm:inline-block">Back</span>
</a>
<div class="font-headline-md text-headline-md font-bold tracking-tighter text-primary">NEXUS</div>
<div class="w-8"></div> <!-- Spacer for centering logo -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile relative overflow-hidden">
<!-- Ambient Background Glow (Subtle depth) -->
<div class="absolute inset-0 pointer-events-none flex items-center justify-center opacity-30">
<div class="w-[600px] h-[600px] bg-primary rounded-full blur-[120px] mix-blend-screen" style="opacity: 0.05;"></div>
</div>
<!-- Authentication Card -->
<div class="w-full max-w-md bg-surface border border-border rounded-xl p-8 relative z-10 shadow-2xl shadow-black/50">
<div class="text-center mb-8">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-text-primary mb-2">Welcome back</h1>
<p class="font-body-md text-body-md text-text-secondary">Sign in to continue to your NEXUS account.</p>
</div>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-text-primary" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary text-lg" data-icon="mail">mail</span>
<input class="w-full bg-background border border-border rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-text-primary placeholder:text-text-secondary/50 input-glow transition-all duration-200" id="email" placeholder="Enter your email" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-text-primary" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary text-lg" data-icon="lock">lock</span>
<input class="w-full bg-background border border-border rounded-lg py-3 pl-10 pr-10 font-body-md text-body-md text-text-primary placeholder:text-text-secondary/50 input-glow transition-all duration-200" id="password" placeholder="Enter your password" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-text-secondary hover:text-text-primary transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-lg" data-icon="visibility" id="visibilityIcon">visibility</span>
</button>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full bg-primary hover:bg-primary-fixed text-on-primary font-label-md text-label-md uppercase tracking-wider py-4 rounded-lg transition-colors duration-200 flex items-center justify-center gap-2 group" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</form><div class="mt-8 text-center">
<p class="font-body-md text-body-md text-text-secondary">
                New to NEXUS? 
                <a class="text-primary hover:text-primary-fixed hover:underline transition-colors ml-1 font-medium" href="#">Create an account</a>
</p>
</div>
<!-- Divider -->

<!-- Secondary Auth -->

</div>
<!-- Bottom Section outside card for spacing -->

</main>
<script>
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibilityIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
                visibilityIcon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
                visibilityIcon.setAttribute('data-icon', 'visibility');
            }
        });
    </script>


</body></html>
