<script>
        // Simple script to handle visual selection state before navigating
        document.querySelectorAll('input[name="role"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                // In a real app, this would submit a form or navigate
                // For demo, we just add a visual cue
                document.querySelectorAll('.role-card').forEach(card => {
                    card.style.borderColor = '#27272a'; // Reset to default border
                    card.style.boxShadow = 'none';
                });
                
                if(e.target.checked) {
                    const parentCard = e.target.closest('.role-card');
                    parentCard.style.borderColor = '#10b981';
                    parentCard.style.boxShadow = '0 0 20px rgba(16, 185, 129, 0.15)';
                    
                    // Simulate processing
                    setTimeout(() => {
                        console.log('Proceeding as:', e.target.value);
                    }, 300);
                }
            });
        });
